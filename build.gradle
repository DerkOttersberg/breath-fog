plugins {
    id 'base'
    alias(libs.plugins.architectury)
    alias(libs.plugins.loom) apply false
}
architectury { minecraft = libs.versions.minecraft.get() }
allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.terraformersmc.com/releases/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        maven { url = 'https://maven.minecraftforge.net/' }
    }
}
subprojects {
    apply plugin: 'java-library'
    java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
    tasks.withType(Test).configureEach { useJUnitPlatform() }
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE.txt')) { into 'META-INF'; rename { 'LICENSE_breath-fog.txt' } }
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}
def cleans = allprojects.collect { it.tasks.named('clean') }
allprojects { tasks.configureEach { task -> if (task.name != 'clean') task.mustRunAfter(cleans) } }

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    inputs.files(fileTree('common/src/main') { include '**/*.java' })
    doLast {
        def forbidden = ['net.fabricmc.', 'net.minecraftforge.', 'net.neoforged.']
        inputs.files.each { file -> file.eachLine { line, n ->
            if (forbidden.any { line.contains(it) }) throw new GradleException("Loader reference in common: ${file}:${n}")
        } }
        fileTree('common/src/main/java/io/github/derkottersberg/breathfog/core').matching { include '**/*.java' }.each { file ->
            if (file.text.contains('net.minecraft.')) throw new GradleException("Minecraft reference in portable core: ${file}")
        }
    }
}
def loaders = ['fabric', 'forge', 'neoforge']
tasks.register('verifyLoaderJar') {
    group = 'verification'
    dependsOn loaders.collect { ":${it}:remapJar" }
    doLast {
        loaders.each { loader ->
            def jarFile = project(":${loader}").tasks.named('remapJar').get().archiveFile.get().asFile
            new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
                def metadataPath = loader == 'fabric' ? 'fabric.mod.json' : "META-INF/${loader == 'forge' ? 'mods.toml' : 'neoforge.mods.toml'}"
                def required = [metadataPath, 'pack.mcmeta', 'io/github/derkottersberg/breathfog/client/BreathFogClient.class',
                    'io/github/derkottersberg/breathfog/core/BreathClock.class', 'META-INF/LICENSE_breath-fog.txt',
                    'assets/minecraft/atlases/particles.json', 'assets/breath_fog/icon.png']
                (0..3).each { i -> ['wisp_', 'pixel_wisp_'].each { required << "assets/breath_fog/textures/particle/${it}${i}.png" } }
                required.each { if (zip.getEntry(it) == null) throw new GradleException("${loader}: missing ${it}") }
                def iconEntry = zip.getEntry('assets/breath_fog/icon.png')
                def iconImage = javax.imageio.ImageIO.read(zip.getInputStream(iconEntry))
                if (iconImage == null || iconImage.width != 400 || iconImage.height != 400) throw new GradleException('Incorrect owner-supplied icon dimensions')
                def packagedIcon = zip.getInputStream(iconEntry).bytes
                def sourceIcon = rootProject.file('common/src/main/resources/assets/breath_fog/icon.png').bytes
                if (!java.util.Arrays.equals(packagedIcon, sourceIcon)) throw new GradleException('Packaged icon differs from the supplied PNG')
                def entries = zip.entries().toList()*.name
                def foreign = ['fabric.mod.json','META-INF/mods.toml','META-INF/neoforge.mods.toml'] - metadataPath
                if (entries.any { it.contains('/qa/') || it.contains('/gametest/') || it.startsWith('net/minecraft/') || it.startsWith('net/fabricmc/') || it.startsWith('com/derko/seamlessapi/') || it.startsWith('assets/minecraft/shaders/') } || foreign.any { it in entries })
                    throw new GradleException("${loader}: development code/dependencies/foreign metadata leaked into jar")
                def metadata = zip.getInputStream(zip.getEntry(metadataPath)).getText('UTF-8')
                if (!metadata.contains(project.version.toString()) || !metadata.contains('1.21.1') || !metadata.contains('CC0-1.0')) throw new GradleException("${loader}: invalid identity/runtime/license")
                if (loader == 'fabric') {
                    def json = new groovy.json.JsonSlurper().parseText(metadata)
                    if (json.id != 'breath_fog' || json.environment != 'client' || json.depends.minecraft != '1.21.1' || json.depends.java != '>=21') throw new GradleException('Incorrect Fabric metadata')
                }
                def controllerBytes = zip.getInputStream(zip.getEntry('io/github/derkottersberg/breathfog/client/BreathFogClient.class')).getText('ISO-8859-1')
                if (loader == 'fabric' && (!controllerBytes.contains('net/minecraft/class_310') || controllerBytes.contains('net/minecraft/client/Minecraft'))) throw new GradleException('Fabric release must use intermediary Minecraft names')
                if (loader != 'fabric' && !controllerBytes.contains('getTextureManager')) throw new GradleException('Forge/NeoForge 1.21.1 release must use Mojang members')
                def atlas = new groovy.json.JsonSlurper().parseText(zip.getInputStream(zip.getEntry('assets/minecraft/atlases/particles.json')).getText('UTF-8'))
                if (atlas.sources.size() != 8 || atlas.sources.any { it.type != 'minecraft:single' || !it.resource.startsWith('breath_fog:') }) throw new GradleException('Atlas must add exactly eight namespaced sprites')
                (0..3).each { i -> ['wisp_':128, 'pixel_wisp_':16].each { prefix, dimension ->
                    def sprite = javax.imageio.ImageIO.read(zip.getInputStream(zip.getEntry("assets/breath_fog/textures/particle/${prefix}${i}.png")))
                    if (sprite.width != dimension || sprite.height != dimension || !sprite.colorModel.hasAlpha()) throw new GradleException('Incorrect sprite size/alpha')
                    (0..<dimension).each { p ->
                        if ([sprite.getRGB(p,0),sprite.getRGB(p,dimension-1),sprite.getRGB(0,p),sprite.getRGB(dimension-1,p)].any { ((it >>> 24) & 255) != 0 }) throw new GradleException('Sprite borders must be transparent')
                    }
                } }
                entries.findAll { it.endsWith('.class') }.each { name ->
                    def stream = new java.io.DataInputStream(zip.getInputStream(zip.getEntry(name)))
                    stream.readInt(); stream.readUnsignedShort()
                    if (stream.readUnsignedShort() != 65) throw new GradleException("Incorrect Java bytecode: ${name}")
                    stream.close()
                }
            }
        }
    }
}
tasks.named('assemble') { dependsOn loaders.collect { ":${it}:assemble" } }
tasks.named('check') { dependsOn ':common:check', 'verifyCommonIsolation', 'verifyLoaderJar' }
