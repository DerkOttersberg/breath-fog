name: Build and verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-build-cache clean check build --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: common/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: breath-fog-mc1.21.1
          path: |
            fabric/build/libs/*-fabric.jar
            fabric/build/libs/*-fabric-sources.jar
            forge/build/libs/*-forge.jar
            forge/build/libs/*-forge-sources.jar
            neoforge/build/libs/*-neoforge.jar
            neoforge/build/libs/*-neoforge-sources.jar
