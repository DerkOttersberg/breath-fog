// Opt-in, separately packaged instrumentation. Never part of a release JAR.
if (project.hasProperty('qa')) {
    sourceSets.create('qa') {
        java.srcDir rootProject.file('common/src/qa/java')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    configurations {
        qaImplementation.extendsFrom implementation
        qaRuntimeOnly.extendsFrom runtimeOnly
    }
    tasks.register('qaHelperJar', Jar) {
        from sourceSets.qa.output
        archiveFileName = "breath-fog-qa-${project.name}-dev.jar"

    }
}

if (project.hasProperty('qa')) {
    tasks.register('remapQaHelperJar', tasks.named('remapJar').get().getClass().superclass) {
        dependsOn tasks.named('qaHelperJar')
        inputFile = tasks.named('qaHelperJar', Jar).flatMap { it.archiveFile }
        archiveFileName = "breath-fog-qa-${project.name}.jar"
        classpath.from(sourceSets.qa.compileClasspath)
    }
}
